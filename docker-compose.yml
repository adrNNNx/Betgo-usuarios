version: '3.8'

# Uso:
#   Levantar:   docker-compose up -d --build
#   Ver logs:   docker-compose logs -f frontend
#   Detener:    docker-compose down
#
#
# Sin default: si falta, el build corta con un mensaje claro en vez de publicar
# una app que apunta a localhost desde el navegador del jugador.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: betgo_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    networks:
      - betgo_network

networks:
  betgo_network:
    external: true
