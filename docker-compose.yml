version: '3.8'

# Uso:
#   Levantar:   docker-compose up -d --build
#   Ver logs:   docker-compose logs -f frontend
#   Detener:    docker-compose down
#
# NEXT_PUBLIC_API_URL se bake en el build — si cambia la IP del servidor,
# hay que rebuildar: docker-compose up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: betgo_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    networks:
      - betgo_network

networks:
  betgo_network:
    external: true
